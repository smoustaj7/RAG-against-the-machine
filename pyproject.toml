[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG Against the Machine - Codebase Question Answering System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fire>=0.5.0",
    "tqdm>=4.65.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "fire.*"
ignore_missing_imports = true


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

