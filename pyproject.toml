[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG Against the Machine - Codebase Question Answering System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fire>=0.5.0",
    "tqdm>=4.65.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "cloudpickle>=3.1.2",
    "cachetools>=7.1.8",
    "msgspec>=0.21.1",
    "blake3>=1.0.9",
    "py-cpuinfo>=9.0.0",
    "prometheus-client>=0.26.0",
    "partial-json-parser>=0.2.1.1.post7",
    "cbor2>=6.1.4",
    "setproctitle>=1.3.7",
    "outlines-core>=0.2.14",
    "diskcache>=5.6.3",
    "lark>=1.3.1",
    "watchfiles>=1.2.0",
    "python-json-logger>=4.2.0",
    "pybase64>=1.5.0",
    "psutil>=7.2.2",
    "einops>=0.8.2",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "compressed-tensors>=0.18.0",
    "pyzmq>=27.2.0",
    "lm-format-enforcer>=0.11.3",
    "pillow>=12.3.0",
    "fastapi>=0.141.1",
    "openai>=3.8.0",
    "openai-harmony>=0.0.8",
    "mistral-common>=1.11.7",
    "aiohttp>=3.14.3",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "fire.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vllm.*"
ignore_missing_imports = true


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

